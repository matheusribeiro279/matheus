<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jujutsu Kaisen: Batalha de Feiticeiros</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #ff2a5f;
      text-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Tela de Seleção */
    .selection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      width: 100%;
      margin-bottom: 20px;
    }

    .char-card {
      background: #1a1a24;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-card:hover {
      border-color: #ff2a5f;
      transform: translateY(-3px);
    }

    .char-card.selected-p1 {
      border-color: #00e5ff;
      background: #002b3d;
    }

    .char-card.selected-p2 {
      border-color: #ff2a5f;
      background: #3d0014;
    }

    .char-card h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .char-card p {
      font-size: 0.8rem;
      color: #aaa;
    }

    .btn {
      background: #ff2a5f;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
      transition: 0.2s;
    }

    .btn:hover {
      background: #e01e4f;
      transform: scale(1.05);
    }

    /* Arena de Batalha */
    .battle-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .arena {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: #15151e;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .fighter-box {
      width: 45%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .health-bar-bg {
      width: 100%;
      height: 25px;
      background: #333;
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid #555;
    }

    .health-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00ff88, #00b894);
      transition: width 0.3s ease;
    }

    .bot-fill {
      background: linear-gradient(90deg, #ff7675, #d63031);
    }

    .skills-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 15px;
    }

    .skill-btn {
      background: #252538;
      border: 1px solid #00e5ff;
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
    }

    .skill-btn:hover {
      background: #00e5ff;
      color: #000;
      font-weight: bold;
    }

    .skill-btn:disabled {
      background: #1a1a24;
      border-color: #444;
      color: #666;
      cursor: not-allowed;
    }

    .battle-log {
      width: 100%;
      height: 150px;
      background: #0a0a0f;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      color: #ccc;
    }

    .log-entry {
      margin-bottom: 5px;
    }

    .log-player { color: #00e5ff; }
    .log-bot { color: #ff2a5f; }
    .log-system { color: #e1b12c; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Jujutsu Kaisen: Clash</h1>

  <!-- TELA DE SELEÇÃO DE PERSONAGEM -->
  <div id="selection-screen" class="selection-screen">
    <h2>Escolha seu Feiticeiro / Maldição</h2>
    <p style="margin-bottom: 20px; color: #aaa;">Selecione seu personagem. O BOT será escolhido aleatoriamente.</p>
    <div id="character-grid" class="character-grid"></div>
    <button id="start-btn" class="btn" onclick="startGame()" disabled>Iniciar Combate</button>
  </div>

  <!-- TELA DE BATALHA -->
  <div id="battle-screen" class="battle-screen">
    <div class="arena">
      <!-- Jogador -->
      <div class="fighter-box">
        <h2 id="p1-name">Jogador</h2>
        <div class="health-bar-bg">
          <div id="p1-health" class="health-bar-fill"></div>
        </div>
        <p id="p1-hp-text">100 / 100 HP</p>
        
        <div id="skills-container" class="skills-container">
          <!-- Botões das habilidades serão gerados via JS -->
        </div>
      </div>

      <!-- BOT -->
      <div class="fighter-box">
        <h2 id="p2-name">BOT</h2>
        <div class="health-bar-bg">
          <div id="p2-health" class="health-bar-fill bot-fill"></div>
        </div>
        <p id="p2-hp-text">100 / 100 HP</p>
        <p style="margin-top: 20px; color: #aaa; font-style: italic;">O Bot responderá após seu ataque...</p>
      </div>
    </div>

    <h3>Registro do Combate</h3>
    <div id="battle-log" class="battle-log"></div>
    <button id="reset-btn" class="btn" style="margin-top: 15px; display: none;" onclick="resetGame()">Jogar Novamente</button>
  </div>

  <script>

          { name: "Rika Blast", damage: 45, heal: 0, desc: "Rika dispara energia pura." },

        skills: [
          { name: "Playful Cloud", damage: 22, heal: 0, desc: "Golpe pesado de bastão." },
          { name: "Dragon Bone", damage: 32, heal: 0, desc: "Lâmina que acumula força." },
          { name: "Soul Split Katana", damage: 48, heal: 0, desc: "Corta ignorando a durabilidade." }
        ]

      {

        ]

          { name: "Disaster Flames", damage: 35, heal: 0, desc: "Jatos de fogo vulcânico." },

        ]

        ]
      },
      {

        hp: 105,
        skills: [
          { name: "Slicing Exorcism", damage: 22, heal: 0, desc: "Disco de sangue afiado." },
          { name: "Blood Meteorite", damage: 32, heal: 0, desc: "Endurece o sangue para o golpe." },

        ]
      },
      {
        id: "kashimo",
        name: "Hajime Kashimo",
        hp: 105,
        skills: [
          { name: "Lightning Strike", damage: 25, heal: 0, desc: "Carga elétrica inevitável." },
          { name: "Electric Discharge", damage: 35, heal: 0, desc: "Choque de alta voltagem." },
          { name: "Mythic Amber Beast", damage: 52, heal: 0, desc: "Transformação de pura energia." }
        ]
      },
      {
        id: "hakari",
        name: "Kinji Hakari",
        hp: 110,
        skills: [
          { name: "Pachinko Strike", damage: 20, heal: 0, desc: "Golpe físico pesado." },
          { name: "Shutter Attack", damage: 30, heal: 0, desc: "Esmaga com portas mecânicas." },
          { name: "Jackpot Mode", damage: 10, heal: 45, desc: "Imortalidade temporária (cura alta)." }
        ]
      },
      {
        id: "inumaki",
        name: "Toge Inumaki",
        hp: 90,
        skills: [
          { name: "Stop!", damage: 15, heal: 0, desc: "Paralisa e causa dano leve." },
          { name: "Plunge!", damage: 30, heal: 0, desc: "Faz o oponente afundar no chão." },
          { name: "Get Crushed!", damage: 45, heal: 0, desc: "Esmaga o alvo com a voz." }
        ]
      },
      {
        id: "higuruma",
        name: "Hiromi Higuruma",
        hp: 100,
        skills: [
          { name: "Gavel Strike", damage: 20, heal: 0, desc: "Golpe com o martelo de juiz." },
          { name: "Confiscation", damage: 30, heal: 0, desc: "Enfraquece o oponente com dano." },
          { name: "Executioner's Sword", damage: 50, heal: 0, desc: "Espada de execução mortal." }
        ]
      },
      {
        id: "kenjaku",
        name: "Kenjaku",
        hp: 115,
        skills: [
          { name: "Curse Manipulation", damage: 22, heal: 0, desc: "Lança maldições antigas." },
          { name: "Gravity Manipulation", damage: 35, heal: 0, desc: "Aumenta a gravidade da área." },
          { name: "Domain Expansion: Womb Profusion", damage: 52, heal: 0, desc: "Domínio sem barreira." }
        ]
      }
    ];

    let player1 = null;
    let player2 = null;
    let isPlayerTurn = true;

    // Renderiza a grade de seleção
    const grid = document.getElementById('character-grid');
    characters.forEach(char => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.id = `card-${char.id}`;
      card.innerHTML = `
        <h3>${char.name}</h3>
        <p>HP: ${char.hp}</p>
      `;
      card.onclick = () => selectCharacter(char);
      grid.appendChild(card);
    });

    function selectCharacter(char) {
      player1 = JSON.parse(JSON.stringify(char)); // Cópia profunda
      player1.currentHp = player1.hp;

      // Atualiza visual da seleção
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected-p1'));
      document.getElementById(`card-${char.id}`).classList.add('selected-p1');

      document.getElementById('start-btn').disabled = false;
    }

    function startGame() {
      if (!player1) return;

      // Escolhe um BOT aleatório
      let randomBot = characters[Math.floor(Math.random() * characters.length)];
      player2 = JSON.parse(JSON.stringify(randomBot));
      player2.currentHp = player2.hp;

      // Configura a tela de batalha
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';

      document.getElementById('p1-name').innerText = player1.name;
      document.getElementById('p2-name').innerText = player2.name + " (BOT)";

      updateHealthBars();
      renderSkills();
      
      logMessage(`A batalha começou! ${player1.name} VS ${player2.name}!`, 'log-system');
    }

    function renderSkills() {
      const container = document.getElementById('skills-container');
      container.innerHTML = '';

      player1.skills.forEach((skill, index) => {
        const btn = document.createElement('button');
        btn.className = 'skill-btn';
        btn.innerHTML = `<strong>${skill.name}</strong><br><small>${skill.desc}</small>`;
        btn.onclick = () => playerAttack(index);
        container.appendChild(btn);
      });
    }

    function playerAttack(skillIndex) {
      if (!isPlayerTurn) return;

      const skill = player1.skills[skillIndex];
      isPlayerTurn = false;
      toggleSkillButtons(false);

      // Dano / Cura do jogador
      let logTxt = `${player1.name} usou <strong>${skill.name}</strong>!`;
      if (skill.damage > 0) {
        player2.currentHp = Math.max(0, player2.currentHp - skill.damage);
        logTxt += ` Causou ${skill.damage} de dano.`;
      }
      if (skill.heal > 0) {
        player1.currentHp = Math.min(player1.hp, player1.currentHp + skill.heal);
        logTxt += ` Recuperou ${skill.heal} de HP.`;
      }

      logMessage(logTxt, 'log-player');
      updateHealthBars();

      if (checkGameOver()) return;

      // Turno do BOT com delay para simular pensamento
      setTimeout(botTurn, 1200);
    }

    function botTurn() {
      // BOT escolhe habilidade aleatória
      const randomSkill = player2.skills[Math.floor(Math.random() * player2.skills.length)];

      let logTxt = `${player2.name} usou <strong>${randomSkill.name}</strong>!`;
      if (randomSkill.damage > 0) {
        player1.currentHp = Math.max(0, player1.currentHp - randomSkill.damage);
        logTxt += ` Causou ${randomSkill.damage} de dano.`;
      }
      if (randomSkill.heal > 0) {
        player2.currentHp = Math.min(player2.hp, player2.currentHp + randomSkill.heal);
        logTxt += ` Recuperou ${randomSkill.heal} de HP.`;
      }

      logMessage(logTxt, 'log-bot');
      updateHealthBars();

      if (!checkGameOver()) {
        isPlayerTurn = true;
        toggleSkillButtons(true);
      }
    }

    function updateHealthBars() {
      const p1Pct = (player1.currentHp / player1.hp) * 100;
      const p2Pct = (player2.currentHp / player2.hp) * 100;

      document.getElementById('p1-health').style.width = p1Pct + '%';
      document.getElementById('p2-health').style.width = p2Pct + '%';

      document.getElementById('p1-hp-text').innerText = `${player1.currentHp} / ${player1.hp} HP`;
      document.getElementById('p2-hp-text').innerText = `${player2.currentHp} / ${player2.hp} HP`;
    }

    function toggleSkillButtons(enable) {
      const btns = document.querySelectorAll('.skill-btn');
      btns.forEach(b => b.disabled = !enable);
    }

    function checkGameOver() {
      if (player1.currentHp <= 0) {
        logMessage(`☠️ ${player1.name} foi derrotado! Você perdeu!`, 'log-system');
        endGame();
        return true;
      }
      if (player2.currentHp <= 0) {
        logMessage(`🏆 ${player2.name} foi derrotado! Você venceu!`, 'log-system');
        endGame();
        return true;
      }
      return false;
    }

    function endGame() {
      toggleSkillButtons(false);
      document.getElementById('reset-btn').style.display = 'block';
    }

    function logMessage(msg, className) {
      const log = document.getElementById('battle-log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${className}`;
      entry.innerHTML = msg;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function resetGame() {
      player1 = null;
      player2 = null;
      isPlayerTurn = true;
      
      document.getElementById('battle-log').innerHTML = '';
      document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'flex';
      
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected-p1'));
      document.getElementById('start-btn').disabled = true;
    }
  </script>
</body>
</html>
